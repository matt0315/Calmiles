name: Calmiles
options:
  bundleIdPrefix: studio.botland
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "8KV5SRG3UC"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Calmiles:
    type: application
    platform: iOS
    sources:
      - path: Calmiles
        excludes:
          - "**/*.md"
    resources:
      - path: Calmiles/Assets.xcassets
      - path: Calmiles/Preview Content
      - path: Configuration/Calmiles.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.botland.calmiles
        INFOPLIST_FILE: Calmiles/Info.plist
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPAD_IPAD: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: CalmilesWidgetExtension
        embed: true
    scheme:
      testTargets:
        - CalmilesTests
        - CalmilesUITests
  CalmilesWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CalmilesWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.botland.calmiles.widget
        INFOPLIST_FILE: CalmilesWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    resources:
      - path: CalmilesWidget/Assets.xcassets
  CalmilesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CalmilesTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.botland.calmiles.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Calmiles.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Calmiles"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Calmiles
  CalmilesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CalmilesUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.botland.calmiles.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Calmiles
    dependencies:
      - target: Calmiles
schemes:
  Calmiles:
    build:
      targets:
        Calmiles: all
        CalmilesWidgetExtension: all
        CalmilesTests: [test]
        CalmilesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CalmilesTests
        - CalmilesUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
